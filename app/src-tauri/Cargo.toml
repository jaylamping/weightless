[package]
name = "weightless-app"
description = "Weightless desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "weightless_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
metal = ["weightless-candle/metal"]
cuda = ["weightless-candle/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
weightless-core.workspace = true
weightless-candle.workspace = true
